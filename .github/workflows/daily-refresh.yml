name: Daily Profile Refresh

on:
  schedule:
    # 每天 UTC 16:00 运行（上海时间 00:00）
    - cron: '0 16 * * *'
  workflow_dispatch:
    # 允许手动触发

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 🧪 Run tests
        run: npm test
      
      - name: 🔄 Refresh profile data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run refresh

      # 使用 contrib-aquarium 官方 composite Action。
      # GraphQL 贡献日历需要 token：这里用 Actions 自动注入的 GITHUB_TOKEN，
      # 无需额外 secrets；拿不到日历时 Action 会回退到公开 Events / mock，鱼缸不会空白。
      # Pin to contrib-aquarium@v0.1.12 (aurora theme).
      # width 860 matches README <img width="860">; omit height → proportional 300.
      - name: 🐠 Generate contribution aquarium
        uses: webywz/contrib-aquarium@v0.1.12
        with:
          user: webywz
          out: assets/aquarium.svg
          width: "860"
          theme: aurora
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📝 Check for changes
        id: check_changes
        run: |
          git diff --quiet README.md data/profile.json assets/stats.svg assets/langs.svg assets/streak.svg assets/aquarium.svg assets/ship-*.svg assets/product-*.svg || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: 💾 Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md data/profile.json assets/stats.svg assets/langs.svg assets/streak.svg assets/aquarium.svg assets/ship-*.svg assets/product-*.svg
          git commit -m "🤖 自动更新 Profile 数据 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          git push
      
      - name: ✅ Done
        if: steps.check_changes.outputs.changed == 'true'
        run: echo "✨ Profile 已成功更新！"
      
      - name: ℹ️ No changes
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "ℹ️ 没有检测到变化，跳过提交"
