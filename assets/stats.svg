<svg xmlns="http://www.w3.org/2000/svg" width="460" height="195" viewBox="0 0 460 195" role="img" aria-label="GitHub Stats">
  <defs>
    <filter id="statsGlow" x="-8%" y="-12%" width="116%" height="124%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#7aa2f7" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="statsEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#7dcfff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <g filter="url(#statsGlow)">
    <rect width="460" height="195" rx="16" fill="#1a1b26" stroke="#3b4261" stroke-width="1.25"/>
  </g>
  <rect x="18" y="1" width="424" height="2" rx="1" fill="url(#statsEdge)">
    <animate attributeName="opacity" values="0.35;0.95;0.35" dur="4.2s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <text x="24" y="36" fill="#7aa2f7" font-size="16" font-weight="700" font-family="Verdana, Geneva, sans-serif">webywz 的 GitHub 统计</text>
  <text x="24" y="56" fill="#565f89" font-size="11" font-family="Verdana, Geneva, sans-serif">theme · tokyonight</text>
  <circle cx="36" cy="72" r="5" fill="#7aa2f7">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3.8s" begin="0.00s" repeatCount="indefinite"/>
  </circle>
  <text x="52" y="78" fill="#c0caf5" font-size="15" font-family="Verdana, Geneva, sans-serif">公开仓库</text>
  <text x="430" y="78" text-anchor="end" fill="#7aa2f7" font-size="16" font-weight="700" font-family="Verdana, Geneva, sans-serif">
    26
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.8s" begin="0.00s" repeatCount="indefinite"/>
  </text>
  <circle cx="36" cy="100" r="5" fill="#7dcfff">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3.8s" begin="0.18s" repeatCount="indefinite"/>
  </circle>
  <text x="52" y="106" fill="#c0caf5" font-size="15" font-family="Verdana, Geneva, sans-serif">Stars</text>
  <text x="430" y="106" text-anchor="end" fill="#7dcfff" font-size="16" font-weight="700" font-family="Verdana, Geneva, sans-serif">
    7
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.8s" begin="0.18s" repeatCount="indefinite"/>
  </text>
  <circle cx="36" cy="128" r="5" fill="#ff9e64">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3.8s" begin="0.36s" repeatCount="indefinite"/>
  </circle>
  <text x="52" y="134" fill="#c0caf5" font-size="15" font-family="Verdana, Geneva, sans-serif">Followers</text>
  <text x="430" y="134" text-anchor="end" fill="#ff9e64" font-size="16" font-weight="700" font-family="Verdana, Geneva, sans-serif">
    3
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.8s" begin="0.36s" repeatCount="indefinite"/>
  </text>
  <circle cx="36" cy="156" r="5" fill="#9ece6a">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3.8s" begin="0.54s" repeatCount="indefinite"/>
  </circle>
  <text x="52" y="162" fill="#c0caf5" font-size="15" font-family="Verdana, Geneva, sans-serif">Forks</text>
  <text x="430" y="162" text-anchor="end" fill="#9ece6a" font-size="16" font-weight="700" font-family="Verdana, Geneva, sans-serif">
    3
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.8s" begin="0.54s" repeatCount="indefinite"/>
  </text>
</svg>
