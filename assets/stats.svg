<svg xmlns="http://www.w3.org/2000/svg" width="420" height="188" viewBox="0 0 420 188" role="img" aria-label="GitHub Stats">
  <defs>
    <filter id="statsShadow" x="-6%" y="-8%" width="112%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#7aa2f7" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="statsEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#7dcfff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <g filter="url(#statsShadow)">
    <rect width="420" height="188" rx="14" fill="#1a1b26" stroke="#3b4261" stroke-width="1"/>
  </g>
  <rect x="20" y="1" width="380" height="2" rx="1" fill="url(#statsEdge)">
    <animate attributeName="opacity" values="0.35;0.85;0.35" dur="4.2s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <text x="22" y="30" fill="#7aa2f7" font-size="13" font-weight="700" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" letter-spacing="0.08em">STATS</text>
  <text x="74" y="30" fill="#565f89" font-size="13" font-weight="500" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">· 统计</text>
  <text x="396" y="30" text-anchor="end" fill="#565f89" font-size="10" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" letter-spacing="0.08em">tokyo-night</text>
  <rect x="22" y="45" width="3" height="16" rx="1.5" fill="#7aa2f7">
    <animate attributeName="opacity" values="0.45;0.85;0.45" dur="3.8s" begin="0.00s" repeatCount="indefinite"/>
  </rect>
  <text x="36" y="56" font-size="13" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><tspan fill="#c0caf5" font-weight="600">Repos</tspan><tspan fill="#565f89" font-weight="500"> · 仓库</tspan></text>
  <text x="396" y="56" text-anchor="end" fill="#c0caf5" font-size="15" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" letter-spacing="0.05em">60</text>
  <line x1="36" y1="70" x2="396" y2="70" stroke="#3b4261" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="22" y="75" width="3" height="16" rx="1.5" fill="#7dcfff">
    <animate attributeName="opacity" values="0.45;0.85;0.45" dur="3.8s" begin="0.18s" repeatCount="indefinite"/>
  </rect>
  <text x="36" y="86" font-size="13" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><tspan fill="#c0caf5" font-weight="600">Stars</tspan><tspan fill="#565f89" font-weight="500"> · 星标</tspan></text>
  <text x="396" y="86" text-anchor="end" fill="#c0caf5" font-size="15" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" letter-spacing="0.05em">7</text>
  <line x1="36" y1="100" x2="396" y2="100" stroke="#3b4261" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="22" y="105" width="3" height="16" rx="1.5" fill="#7aa2f7">
    <animate attributeName="opacity" values="0.45;0.85;0.45" dur="3.8s" begin="0.36s" repeatCount="indefinite"/>
  </rect>
  <text x="36" y="116" font-size="13" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><tspan fill="#c0caf5" font-weight="600">Followers</tspan><tspan fill="#565f89" font-weight="500"> · 关注</tspan></text>
  <text x="396" y="116" text-anchor="end" fill="#c0caf5" font-size="15" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" letter-spacing="0.05em">3</text>
  <line x1="36" y1="130" x2="396" y2="130" stroke="#3b4261" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="22" y="135" width="3" height="16" rx="1.5" fill="#7dcfff">
    <animate attributeName="opacity" values="0.45;0.85;0.45" dur="3.8s" begin="0.54s" repeatCount="indefinite"/>
  </rect>
  <text x="36" y="146" font-size="13" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><tspan fill="#c0caf5" font-weight="600">Forks</tspan><tspan fill="#565f89" font-weight="500"> · 派生</tspan></text>
  <text x="396" y="146" text-anchor="end" fill="#c0caf5" font-size="15" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" letter-spacing="0.05em">3</text>
  
</svg>
