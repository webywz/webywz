<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="20" viewBox="0 0 420 20" role="img" aria-label="breathing card chrome">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dcfff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardGlow" x="-4%" y="-40%" width="108%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#7aa2f7" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#cardGlow)">
    <rect x="0.75" y="0.75" width="418.5" height="18.5" rx="9" fill="#1a1b26" stroke="#3b4261" stroke-width="1"/>
  </g>
  <rect x="24" y="1" width="372" height="2" rx="1" fill="url(#g)">
    <animate attributeName="opacity" values="0.3;0.85;0.3" dur="4.2s" repeatCount="indefinite"/>
  </rect>
  <circle cx="36" cy="10" r="2.5" fill="#7aa2f7">
    <animate attributeName="opacity" values="0.35;0.95;0.35" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="10" r="2.5" fill="#7dcfff">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.2s" begin="0.35s" repeatCount="indefinite"/>
  </circle>
  <circle cx="64" cy="10" r="2.5" fill="#7aa2f7">
    <animate attributeName="opacity" values="0.25;0.8;0.25" dur="4.2s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
</svg>
