<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="12" viewBox="0 0 880 12" role="img" aria-label="breath divider">
  <defs>
    <linearGradient id="d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7aa2f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="80" y="5" width="720" height="2" rx="1" fill="url(#d)">
    <animate attributeName="opacity" values="0.25;0.85;0.25" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="440" cy="6" r="2.25" fill="#7dcfff">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.8;2.6;1.8" dur="5.5s" repeatCount="indefinite"/>
  </circle>
</svg>
