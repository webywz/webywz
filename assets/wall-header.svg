<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="48" viewBox="0 0 880 48" role="img" aria-label="Product wall · 产品墙">
  <defs>
    <linearGradient id="wbg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="50%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="wg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dcfff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="wallShadow" x="-2%" y="-20%" width="104%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#7aa2f7" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g filter="url(#wallShadow)">
    <rect x="1" y="1" width="878" height="46" rx="14" fill="url(#wbg)" stroke="#3b4261" stroke-width="1"/>
  </g>
  <rect x="40" y="1" width="800" height="2" rx="1" fill="url(#wg)">
    <animate attributeName="opacity" values="0.3;0.85;0.3" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <text x="440" y="30" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="0.04em"><tspan fill="#7aa2f7" font-weight="700" letter-spacing="0.1em">PRODUCT WALL</tspan><tspan fill="#565f89" font-weight="500"> · 产品墙</tspan></text>
</svg>
