<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="52" viewBox="0 0 880 52" role="img" aria-label="Product wall · 产品墙">
  <defs>
    <linearGradient id="wbg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="50%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="wg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7aa2f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="wallShadow" x="-2%" y="-20%" width="104%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#7aa2f7" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g filter="url(#wallShadow)">
    <rect x="1" y="1" width="878" height="50" rx="12" fill="url(#wbg)" stroke="#3b4261" stroke-width="1.5"/>
  </g>
  <rect x="40" y="24" width="220" height="3" rx="1.5" fill="url(#wg)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="620" y="24" width="220" height="3" rx="1.5" fill="url(#wg)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="276" cy="26" r="3.25" fill="#7aa2f7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="604" cy="26" r="3.25" fill="#7dcfff">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <text x="440" y="31" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#7aa2f7" letter-spacing="4">PRODUCT WALL</text>
</svg>
