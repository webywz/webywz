<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-label="Noah · webywz · contributions that breathe">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="55%" stop-color="#12182a"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <radialGradient id="core" cx="72%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#7dcfff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1a1b26" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0caf5"/>
      <stop offset="55%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1100" height="260" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1100" height="260" fill="url(#bg)"/>

    <!-- Breathing light core -->
    <g filter="url(#softGlow)">
      <circle cx="790" cy="100" r="110" fill="url(#core)">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="790" cy="100" r="46" fill="#7aa2f7" opacity="0.18">
        <animate attributeName="opacity" values="0.12;0.28;0.12" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="40;52;40" dur="4.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Quiet secondary glow -->
    <circle cx="180" cy="200" r="70" fill="#7dcfff" opacity="0.05">
      <animate attributeName="opacity" values="0.03;0.08;0.03" dur="5.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Sparse contribution cells — clinical, not busy -->
    <g transform="translate(56, 42)" opacity="0.9">
      <g fill="#1f2335">
        <rect x="0" y="0" width="10" height="10" rx="2"/><rect x="14" y="0" width="10" height="10" rx="2"/><rect x="28" y="0" width="10" height="10" rx="2"/><rect x="42" y="0" width="10" height="10" rx="2"/><rect x="56" y="0" width="10" height="10" rx="2"/><rect x="70" y="0" width="10" height="10" rx="2"/><rect x="84" y="0" width="10" height="10" rx="2"/><rect x="98" y="0" width="10" height="10" rx="2"/><rect x="112" y="0" width="10" height="10" rx="2"/><rect x="126" y="0" width="10" height="10" rx="2"/>
        <rect x="0" y="14" width="10" height="10" rx="2"/><rect x="14" y="14" width="10" height="10" rx="2"/><rect x="28" y="14" width="10" height="10" rx="2"/><rect x="42" y="14" width="10" height="10" rx="2"/><rect x="56" y="14" width="10" height="10" rx="2"/><rect x="70" y="14" width="10" height="10" rx="2"/><rect x="84" y="14" width="10" height="10" rx="2"/><rect x="98" y="14" width="10" height="10" rx="2"/><rect x="112" y="14" width="10" height="10" rx="2"/><rect x="126" y="14" width="10" height="10" rx="2"/>
        <rect x="0" y="28" width="10" height="10" rx="2"/><rect x="14" y="28" width="10" height="10" rx="2"/><rect x="28" y="28" width="10" height="10" rx="2"/><rect x="42" y="28" width="10" height="10" rx="2"/><rect x="56" y="28" width="10" height="10" rx="2"/><rect x="70" y="28" width="10" height="10" rx="2"/><rect x="84" y="28" width="10" height="10" rx="2"/><rect x="98" y="28" width="10" height="10" rx="2"/><rect x="112" y="28" width="10" height="10" rx="2"/><rect x="126" y="28" width="10" height="10" rx="2"/>
        <rect x="0" y="42" width="10" height="10" rx="2"/><rect x="14" y="42" width="10" height="10" rx="2"/><rect x="28" y="42" width="10" height="10" rx="2"/><rect x="42" y="42" width="10" height="10" rx="2"/><rect x="56" y="42" width="10" height="10" rx="2"/><rect x="70" y="42" width="10" height="10" rx="2"/><rect x="84" y="42" width="10" height="10" rx="2"/><rect x="98" y="42" width="10" height="10" rx="2"/><rect x="112" y="42" width="10" height="10" rx="2"/><rect x="126" y="42" width="10" height="10" rx="2"/>
      </g>
      <rect x="28" y="0" width="10" height="10" rx="2" fill="#7aa2f7"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.8s" repeatCount="indefinite"/></rect>
      <rect x="70" y="14" width="10" height="10" rx="2" fill="#7dcfff"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.6s" repeatCount="indefinite"/></rect>
      <rect x="98" y="28" width="10" height="10" rx="2" fill="#7aa2f7"><animate attributeName="opacity" values="0.4;1;0.4" dur="5.1s" repeatCount="indefinite"/></rect>
      <rect x="42" y="42" width="10" height="10" rx="2" fill="#9ece6a"><animate attributeName="opacity" values="0.35;0.95;0.35" dur="4.2s" repeatCount="indefinite"/></rect>
      <rect x="112" y="14" width="10" height="10" rx="2" fill="#7dcfff"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="5.6s" repeatCount="indefinite"/></rect>
    </g>

    <!-- Soft horizon line -->
    <path fill="#7aa2f7" opacity="0.06" d="M0 198 C 180 176, 320 214, 500 190 C 680 166, 860 210, 1100 184 L 1100 260 L 0 260 Z">
      <animate attributeName="opacity" values="0.04;0.09;0.04" dur="5s" repeatCount="indefinite"/>
    </path>

    <text x="550" y="122" text-anchor="middle" font-family="ui-sans-serif, 'Segoe UI', 'PingFang SC', sans-serif" font-size="64" font-weight="700" fill="url(#title)" letter-spacing="12">NOAH</text>
    <text x="550" y="158" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#7aa2f7" letter-spacing="3" opacity="0.95">webywz · contributions that breathe</text>
    <text x="550" y="186" text-anchor="middle" font-family="'PingFang SC', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="14" fill="#565f89" letter-spacing="2">把贡献变成会呼吸的东西</text>
  </g>
</svg>
