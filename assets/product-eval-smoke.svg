<svg xmlns="http://www.w3.org/2000/svg" width="420" height="208" viewBox="0 0 420 208" role="img" aria-label="eval-smoke">
  <defs>
    <filter id="pwevalsmokeShadow" x="-6%" y="-8%" width="112%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#7aa2f7" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="pwevalsmokeEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#7dcfff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <g filter="url(#pwevalsmokeShadow)">
    <rect width="420" height="208" rx="14" fill="#1a1b26" stroke="#3b4261" stroke-width="1"/>
  </g>
  <rect x="20" y="1" width="380" height="2" rx="1" fill="url(#pwevalsmokeEdge)">
    <animate attributeName="opacity" values="0.35;0.85;0.35" dur="4.2s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <text x="22" y="34" fill="#c0caf5" font-size="15" font-weight="700" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">eval-smoke</text>
  <rect x="362" y="20" width="36" height="18" rx="9" fill="#16161e" stroke="#3b4261" stroke-width="1"/>
  <text x="380" y="33" text-anchor="middle" fill="#7dcfff" font-size="9" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" letter-spacing="0.06em">CLI</text>
  <text x="22" y="58" fill="#a9b1d6" font-size="12" font-weight="500" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">One-minute smoke evals for prompts and models.</text>
  <text x="22" y="78" fill="#565f89" font-size="12" font-weight="500" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">一分钟跑通 prompt / 模型冒烟评测。</text>
  <rect x="18" y="158" width="384" height="34" rx="8" fill="#16161e" stroke="#292e42" stroke-width="1"/>
  <text x="30" y="179" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#7aa2f7">›</text>
  <text x="46" y="179" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#c0caf5">npx @webywz/eval-smoke</text>
  <rect x="204.4" y="168" width="7" height="14" rx="1.5" fill="#7aa2f7">
    <animate attributeName="opacity" values="1;0.12;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
