<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="88" viewBox="0 0 960 88" role="img" aria-label="npx contrib-aquarium — living SVG from your contribution graph">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131c"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#7dcfff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="termFrame"><rect width="960" height="88" rx="14"/></clipPath>
    <clipPath id="typeClip">
      <rect x="96" y="28" width="0" height="28">
        <animate attributeName="width" values="0;520;520;520;0" keyTimes="0;0.28;0.72;0.88;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <g clip-path="url(#termFrame)">
    <rect width="960" height="88" fill="url(#termBg)"/>
    <rect x="0" y="0" width="960" height="2" fill="url(#edge)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="86" width="960" height="2" fill="#7aa2f7" opacity="0.12">
      <animate attributeName="opacity" values="0.08;0.22;0.08" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <!-- traffic lights -->
    <circle cx="28" cy="28" r="5" fill="#f7768e" opacity="0.65"/>
    <circle cx="48" cy="28" r="5" fill="#e0af68" opacity="0.65"/>
    <circle cx="68" cy="28" r="5" fill="#9ece6a" opacity="0.65"/>
    <text x="96" y="32" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#565f89">webywz — zsh</text>
    <!-- prompt -->
    <text x="28" y="62" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#7aa2f7">❯</text>
    <g clip-path="url(#typeClip)">
      <text x="96" y="62" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#c0caf5">npx contrib-aquarium</text>
      <text x="320" y="62" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#7dcfff" opacity="0.9">— living SVG from your contribution graph</text>
    </g>
    <!-- blinking cursor after typed width ~ cycles -->
    <rect x="96" y="46" width="9" height="20" fill="#7aa2f7">
      <animate attributeName="x" values="96;616;616;616;96" keyTimes="0;0.28;0.72;0.88;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>
    <!-- soft side glow -->
    <rect x="0" y="0" width="3" height="88" fill="#7aa2f7" opacity="0.35">
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
